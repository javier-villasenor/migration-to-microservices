##################################################################################################
# Ratings service
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: ratings-svc
  namespace: cdps-g5
  labels:
    app: ratings
    service: ratings
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: ratings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratings-v1
  namespace: cdps-g5
  labels:
    app: ratings
    version: v1
spec:
  replicas: 3  # Factor de replicación 3 según requisitos
  selector:
    matchLabels:
      app: ratings
      version: v1
  template:
    metadata:
      labels:
        app: ratings
        version: v1
    spec:
      containers:
      - name: ratings
        image: docker.io/istio/examples-bookinfo-ratings-v1:1.16.2
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_VERSION
          value: "v1"
        ports:
        - containerPort: 9080
        securityContext:
          runAsUser: 1000