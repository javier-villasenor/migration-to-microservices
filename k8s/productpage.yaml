##################################################################################################
# ProductPage service (LoadBalancer for external access)
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  name: productpage-svc
  namespace: cdps-G5
  labels:
    app: productpage
    service: productpage
spec:
  type: LoadBalancer
  ports:
  - port: 9080
    name: http
  selector:
    app: productpage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
  namespace: cdps-g5
  labels:
    app: productpage
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productpage
      version: v1
  template:
    metadata:
      labels:
        app: productpage
        version: v1
    spec:
      containers:
      - name: productpage
        image: docker.io/istio/examples-bookinfo-productpage-v1:1.16.2
        imagePullPolicy: IfNotPresent
        env:
        - name: TEAM_ID
          value: "G5"
        - name: APP_OWNER
          value: "Ares-et-al"
        - name: DETAILS_HOSTNAME
          value: "details-svc"
        - name: REVIEWS_HOSTNAME
          value: "reviews-svc"
        - name: RATINGS_HOSTNAME
          value: "ratings-svc"
        ports:
        - containerPort: 9080